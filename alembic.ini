# Alembic settings. The app runs migrations itself at start-up (app/db.py init_db); by hand:
#   .venv\Scripts\python -m alembic upgrade head
# The database URL comes from DATABASE_URL (see app/config.py), not from this file.
[alembic]
script_location = %(here)s/migrations

[loggers]
keys = root,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
