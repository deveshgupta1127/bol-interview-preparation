# On every push to main: run the tests, build the API image into GitHub's free registry (ghcr.io), and publish the
# website to Azure Static Web Apps. The API itself is switched to the new image from your laptop with
# infra\deploy.ps1 (your Azure sign-in stays on your computer; GitHub only holds the website's deploy token).
#
# Repository settings this needs (Settings -> Secrets and variables -> Actions):
#   secret   AZURE_STATIC_WEB_APPS_API_TOKEN   from: az staticwebapp secrets list -n bol-web -g bol-rg
#   variable API_URL                           the apiUrl printed by infra\provision.ps1
name: Test and deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -q

  image:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Image name (registry names must be lower case)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}

  website:
    needs: test
    if: ${{ vars.API_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Point the website at the API
        env:
          API_URL: ${{ vars.API_URL }}
        run: |
          echo "window.BOL_CONFIG = { apiBase: \"${API_URL}\" };" > web/config.js
          sed -i "s|__API_ORIGIN__|${API_URL}|" web/staticwebapp.config.json
          grep -q "${API_URL}" web/staticwebapp.config.json
      - uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          action: upload
          app_location: web
          skip_app_build: true
